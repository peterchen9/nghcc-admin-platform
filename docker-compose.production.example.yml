name: nghcc-admin-platform-production

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: nghcc-admin-nginx
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "${APP_PORT:-26001}:80"
      # Enable only after TLS certificates and final hostnames are approved.
      # - "${APP_TLS_PORT:-26443}:443"
    volumes:
      - ./deploy/nginx/nghcc-admin-platform.conf.example:/etc/nginx/conf.d/default.conf:ro
      - nghcc-admin-static-data:/var/www/nghcc-admin/static:ro
      - nghcc-admin-media-data:/var/www/nghcc-admin/media:ro
    healthcheck:
      test: ["CMD-SHELL", "nginx -t"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - nghcc-admin-public
      - nghcc-admin-private

  web:
    container_name: nghcc-admin-web
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - path: ${PRODUCTION_ENV_FILE:-.env.production}
        required: false
    environment:
      DB_HOST: db
      DB_PORT: 3306
      UPLOAD_DIR: /app/media
    command: ["gunicorn", "nads26.wsgi:application", "--bind", "0.0.0.0:8000"]
    expose:
      - "8000"
    volumes:
      - nghcc-admin-static-data:/app/staticfiles
      - nghcc-admin-media-data:/app/media
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; s=socket.create_connection(('127.0.0.1', 8000), 5); s.close()\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - nghcc-admin-private

  migrate:
    profiles:
      - release
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - path: ${PRODUCTION_ENV_FILE:-.env.production}
        required: false
    environment:
      DB_HOST: db
      DB_PORT: 3306
      UPLOAD_DIR: /app/media
    command: ["python", "manage.py", "migrate", "--noinput"]
    volumes:
      - nghcc-admin-media-data:/app/media
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks:
      - nghcc-admin-private

  collectstatic:
    profiles:
      - release
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - path: ${PRODUCTION_ENV_FILE:-.env.production}
        required: false
    environment:
      DB_HOST: db
      DB_PORT: 3306
    command: ["python", "manage.py", "collectstatic", "--noinput"]
    volumes:
      - nghcc-admin-static-data:/app/staticfiles
    restart: "no"
    networks:
      - nghcc-admin-private

  db:
    container_name: nghcc-admin-db
    image: mysql:8.0
    env_file:
      - path: ${PRODUCTION_ENV_FILE:-.env.production}
        required: false
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - nghcc-admin-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - nghcc-admin-private

volumes:
  nghcc-admin-mysql-data:
    name: nghcc-admin-mysql-data
  nghcc-admin-static-data:
    name: nghcc-admin-static-data
  nghcc-admin-media-data:
    name: nghcc-admin-media-data

networks:
  nghcc-admin-public:
    name: nghcc-admin-public
  nghcc-admin-private:
    name: nghcc-admin-private
    internal: true
